<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiraKelen — Administration</title>
<style>
:root{--orange:#F77F00;--orange-dark:#E25F00;--cream:#FDF6EE;--white:#fff;--text:#1A1A1A;--muted:#6B6B6B;--green:#1B7A2B;--red:#D32F2F;--border:#E8E4DD}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.5}
.container{max-width:1000px;margin:0 auto;padding:24px}
header{background:var(--text);color:#fff;padding:16px 0;margin-bottom:28px}
header .container{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;color:var(--orange)}
header a{color:#ccc;font-size:13px;text-decoration:none}
header a:hover{color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
h2{font-size:20px;margin-bottom:16px}
h3{font-size:15px;margin:16px 0 10px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
button{padding:11px 18px;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.pill.ok{background:#E2F2E5;color:var(--green)}
.pill.off{background:#F5F5F0;color:var(--muted)}
.pill.warn{background:#FFE8D4;color:#B35A00}
.msg{padding:12px 16px;border-radius:9px;margin-bottom:14px;font-size:14px;display:none}
.msg.show{display:block}
.msg.ok{background:#E2F2E5;color:var(--green)}
.msg.err{background:#FDECEA;color:var(--red)}
.notes-preview{white-space:pre-line;font-size:12px;color:var(--muted)}
@media(max-width:700px){.row{flex-direction:column}}
</style>
</head>
<body>
<header><div class="container"><h1>SIRA KELEN — Administration</h1><a href="../index.html">← Site officiel</a></div></header>

<div class="container">
  <div id="msg" class="msg"></div>

  <!-- Connexion admin -->
  <div class="card" id="loginCard">
    <h2>Connexion</h2>
    <label>Email</label><input id="email" value="admin@sirakele.com">
    <label>Mot de passe</label><input id="password" type="password">
    <div class="actions"><button class="btn-primary" onclick="login()">Se connecter</button></div>
  </div>

  <!-- Gestion des versions -->
  <div id="adminContent" style="display:none">
    <div class="card">
      <h2>Publier une nouvelle version</h2>
      <div class="row">
        <div><label>Numéro de version</label><input id="version" placeholder="1.0.1"></div>
        <div><label>Code de version (build)</label><input id="buildNumber" type="number" value="2"></div>
        <div><label>Plateforme</label><select id="plateforme"><option value="android">Android</option><option value="web">Web</option></select></div>
      </div>
      <label>URL de l'APK Release (Android)</label>
      <input id="apkUrl" placeholder="https://github.com/.../sirakelen-v1.0.1-release.apk">
      <label>Taille de l'APK (octets)</label>
      <input id="tailleOctets" type="number" placeholder="57640386">
      <label>Notes de mise à jour (1 nouveauté par ligne)</label>
      <textarea id="notes" placeholder="Nouveauté 1&#10;Nouveauté 2"></textarea>
      <div class="row" style="align-items:center;margin-top:12px">
        <label style="margin:0"><input type="checkbox" id="obligatoire" style="width:auto"> Mise à jour obligatoire</label>
      </div>
      <div class="actions">
        <button class="btn-primary" onclick="creerVersion()">Créer le brouillon</button>
        <button class="btn-ghost" onclick="location.reload()">Réinitialiser</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">Une version créée n'est jamais publiée automatiquement. Utilisez « Publier » dans le tableau ci-dessous.</p>
    </div>

    <div class="card">
      <h2>Versions enregistrées</h2>
      <table><thead><tr><th>Version</th><th>Plateforme</th><th>Publication</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody id="versionsBody"></tbody></table>
    </div>
  </div>
</div>

<script>
const API='https://sirakele-api.onrender.com';
let token=null;

function msg(text,ok){const e=document.getElementById('msg');e.textContent=text;e.className='msg show '+(ok?'ok':'err');setTimeout(()=>e.className='msg',5000);}

async function login(){
  try{
    const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,motDePasse:document.getElementById('password').value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||'Connexion échouée');
    token=d.token;
    document.getElementById('loginCard').style.display='none';
    document.getElementById('adminContent').style.display='block';
    await chargerVersions();
    msg('Connecté en tant que '+d.prenom,true);
  }catch(e){msg(e.message,false);}
}

async function chargerVersions(){
  try{
    const r=await fetch(API+'/versions/all');
    const versions=await r.json();
    const body=document.getElementById('versionsBody');
    body.innerHTML=versions.map(v=>{
      const date=v.datePublication?new Date(v.datePublication).toLocaleDateString('fr-FR'):'—';
      const statut=v.actif?'<span class="pill ok">Active</span>':'<span class="pill off">Brouillon</span>';
      const oblig=v.obligatoire?' <span class="pill warn">Obligatoire</span>':'';
      return '<tr><td><strong>'+v.version+'</strong> (build '+v.buildNumber+')<div class="notes-preview">'+(v.notes||'').split('\n').slice(0,2).join(' · ')+'</div></td>'+
        '<td>'+v.plateforme+'</td><td>'+date+'</td><td>'+statut+oblig+'</td><td>'+
        (v.actif?'<button class="btn-ghost" onclick="desactiver(\''+v.id+'\')">Désactiver</button>':'<button class="btn-primary" onclick="publier(\''+v.id+'\')">Publier</button>')+
        '</td></tr>';
    }).join('')||'<tr><td colspan="5">Aucune version.</td></tr>';
  }catch(e){msg('Erreur chargement versions: '+e.message,false);}
}

async function creerVersion(){
  const dto={
    version:document.getElementById('version').value.trim(),
    buildNumber:parseInt(document.getElementById('buildNumber').value),
    plateforme:document.getElementById('plateforme').value,
    apkUrl:document.getElementById('apkUrl').value.trim()||undefined,
    tailleOctets:parseInt(document.getElementById('tailleOctets').value)||undefined,
    notes:document.getElementById('notes').value.trim(),
    obligatoire:document.getElementById('obligatoire').checked,
  };
  try{
    const r=await fetch(API+'/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dto)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||'Erreur');
    msg('Brouillon créé. Publiez-le quand il est prêt.',true);
    document.getElementById('notes').value='';
    await chargerVersions();
  }catch(e){msg(e.message,false);}
}

async function publier(id){
  if(!confirm('Publier cette version ? Elle deviendra la version active pour sa plateforme.'))return;
  try{
    const r=await fetch(API+'/versions/'+id+'/publier',{method:'POST'});
    if(!r.ok)throw new Error('Erreur publication');
    msg('Version publiée avec succès.',true);
    await chargerVersions();
  }catch(e){msg(e.message,false);}
}

async function desactiver(id){
  if(!confirm('Désactiver cette version ?'))return;
  try{
    const r=await fetch(API+'/versions/'+id+'/desactiver',{method:'POST'});
    if(!r.ok)throw new Error('Erreur');
    msg('Version désactivée.',true);
    await chargerVersions();
  }catch(e){msg(e.message,false);}
}

</script>
</body>
</html>
