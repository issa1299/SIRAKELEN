<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Partage de trajets au Mali">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme color -->
  <meta name="theme-color" content="#F77F00">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIRA KELEN">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <title>SIRA KELEN</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash screen styles */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FDF6EE;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FDF6EE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash-screen img.logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
    }

    #splash-screen .progress-bar {
      width: 200px;
      height: 4px;
      background-color: #E8E4DD;
      border-radius: 2px;
      overflow: hidden;
    }

    #splash-screen .progress-bar-fill {
      height: 100%;
      background-color: #F77F00;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    #splash-screen .app-name {
      margin-top: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #F77F00;
    }

    /* Update notification */
    #update-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #F77F00;
      color: white;
      padding: 12px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      z-index: 10000;
      display: none;
      cursor: pointer;
    }

    #update-banner.visible {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash-screen">
    <img class="logo" src="logo.png" alt="SIRA KELEN">
    <div class="app-name">SIRA KELEN</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Update banner -->
  <div id="update-banner" onclick="window.location.reload()">
    Nouvelle version disponible : recharger
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Retire le splash UNIQUEMENT quand Flutter a dessine son premier frame.
    // Pas de timeout : sur reseau mobile lent, Flutter peut prendre > 10s.
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          splash.remove();
        }, 300);
      }
    });

    // Fallback tardif (60s) uniquement si Flutter n'a jamais demarre,
    // avec un message clair au lieu d'un ecran blanc.
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.innerHTML =
          '<div style="max-width:320px;text-align:center;padding:24px;">' +
          '<div style="font-size:17px;font-weight:700;color:#F77F00;margin-bottom:12px;">Chargement lent détecté</div>' +
          '<div style="font-size:14px;color:#6B6B6B;line-height:1.5;margin-bottom:20px;">Vérifiez votre connexion puis rechargez la page.</div>' +
          '<button onclick="location.reload()" style="background:#F77F00;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;">Réessayer</button>' +
          '</div>';
        splash.style.display = 'flex';
        splash.style.flexDirection = 'column';
        splash.style.alignItems = 'center';
        splash.style.justifyContent = 'center';
      }
    }, 60000);

    // Service worker update detection
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(registration) {
        registration.addEventListener('updatefound', function() {
          var newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                var banner = document.getElementById('update-banner');
                if (banner) {
                  banner.classList.add('visible');
                }
              }
            });
          }
        });
      });
    }
  </script>
</body>
</html>
